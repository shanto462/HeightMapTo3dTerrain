name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
      placeholder: For example, "I need to import the terrain into a game engine that only reads FBX."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work? A sample command helps.
      placeholder: For example, "hmterrain heightmap.png terrain.fbx"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      placeholder: For example, "Converting the glTF output with another tool, but it loses vertex colors."
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, or sample files.
