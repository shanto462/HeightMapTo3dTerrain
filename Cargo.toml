[package]
name = "heightmap-to-3d-terrain"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
description = "Fast, accurate conversion of grayscale heightmaps into 3D terrain meshes (glTF, OBJ, STL, PLY)"
license = "MIT"
repository = "https://github.com/shanto462/HeightMapTo3dTerrain"
readme = "README.md"
keywords = ["heightmap", "terrain", "mesh", "delaunay", "gis"]
categories = ["command-line-utilities", "graphics", "science::geo"]
include = ["src/**/*", "tests/**/*", "README.md", "LICENSE", "CHANGELOG.md"]

[lib]
name = "heightmap_terrain"
path = "src/lib.rs"

[[bin]]
name = "hmterrain"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
image = { version = "0.25.10", default-features = false, features = ["png", "tiff", "jpeg", "bmp", "tga", "pnm"] }
itoa = "1.0.18"
rayon = "1.12.0"
ryu = "1.0.23"
serde_json = "1.0.151"
thiserror = "2.0.21"

[dev-dependencies]
assert_cmd = "2.2.2"
gltf = "1.4.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
predicates = "3.1.4"
proptest = "1.11.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
module_name_repetitions = "allow"
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
